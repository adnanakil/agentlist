[project]
name = "orchestrator"
version = "0.1.0"
description = "AgentGate orchestrator — agent execution lifecycle"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "celery[redis]>=5.4",
    "httpx>=0.27",
    "cryptography>=43.0",
    "structlog>=24.4",
    "ag-common",
    "ag-db",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]
