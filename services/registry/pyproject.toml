[project]
name = "registry"
version = "0.1.0"
description = "AgentGate agent registry — catalog and semantic search"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.27",
    "openai>=1.50",
    "structlog>=24.4",
    "pgvector>=0.3",
    "ag-common",
    "ag-db",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["registry"]
