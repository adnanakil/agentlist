  group_name: Noah updates
  now: '2026-08-09T15:22:00-07:00'
  internal: false
  seed:
    profile:
      name: Dana
      home_location: San Diego, CA
      timezone: America/Los_Angeles
    baby:
      name: Noah
      birthdate: '2026-08-06'
    baby_events:
    - kind: feed
      at: '2026-08-09T10:40:00-07:00'
      note: nursing both sides
  message: '[+15550200001]: what else can you do'
  tool_fixtures: {}
  expect:
    silent_expected: false
    reply_should: Names capabilities they have not used yet (summaries, export,
