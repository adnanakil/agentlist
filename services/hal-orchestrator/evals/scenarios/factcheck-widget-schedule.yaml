id: factcheck-widget-schedule
category: fact-check-links
description: 'Class schedule behind a booking widget: fetch the widget data and cite the concrete
  class/time instead of punting to "call them" (the 07-13 chelseaforestplay miss; the tool-layer
  widget unwrap that surfaces this URL is unit-tested in tests_widget_unwrap.py)'
silo: '+15550100001'
is_group: false
sender: '+15550100001'
now: '2026-07-14T08:45:00-04:00'
internal: false
seed:
  profile:
    name: Adnan
    home_location: Chelsea, Manhattan, NYC
    timezone: America/New_York
  memories:
  - Baby Bazzy born April 2, 2026 — activities should fit a ~3-month-old
message: any baby open play at chelsea forest play today? their booking page is
  https://www.chelseaforestplay.com/book-a-class
tool_fixtures:
  web_fetch: 'Chelsea Forest Play — schedule widget (hisawyer.com/chelsea-forest-play/schedules/widget_calendar).
    Tuesday July 14: 9:10am-10:00am Open Play (1-5 yrs); 10:10am-11:00am Open Play: Early Explorers
    (Ages 1-3) [FULL]; 11:10am-12:00pm Open Play: Babies (0-12 months, 6 spots open, $35 drop-in);
    3:30pm-4:20pm Open Play (1-5 yrs). Address: 241 W 20th St.

    [BOOKING/SCHEDULE WIDGET DETECTED — this page loads its schedule inside an embedded widget;
    the times above come from the widget URL.]'
  browser: 'Chelsea Forest Play — Book a Class. Tabs: Drop-ins, Semesters, Camps/Events, Class
    Packs, Gift Cards. (Calendar content loads in an embedded booking widget.)'
expect:
  tools_called:
  - web_fetch
  silent_expected: false
  reply_should: 'Cites the concrete baby-appropriate slot from the schedule data — Open Play: Babies
    today 11:10am-12:00pm (0-12 months, spots open) — rather than the toddler sessions, and does NOT
    punt to "call them"/"couldn''t verify online". Mentioning price, address, or the full-day list
    is fine but the specific babies slot with its time is required.'
