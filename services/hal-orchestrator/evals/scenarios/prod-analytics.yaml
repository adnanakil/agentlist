  is_group: true
  sender: '+15550400002'
  group_name: Baby log
  now: '2026-08-12T09:30:00-04:00'
  internal: false
  seed:
    profile:
      name: Adnan
      home_location: Chelsea, Manhattan, NYC
      timezone: America/New_York
    baby:
      name: Bazzy
      birthdate: '2026-01-04'
    baby_events:
    - kind: wake
      at: '2026-08-07T06:12:00-04:00'
      note: morning wake
    - kind: wake
      at: '2026-08-08T06:30:00-04:00'
      note: morning wake
    - kind: wake
      at: '2026-08-09T06:00:00-04:00'
      note: morning wake
    - kind: wake
      at: '2026-08-10T06:20:00-04:00'
      note: morning wake
    - kind: wake
      at: '2026-08-11T06:45:00-04:00'
      note: morning wake
  message: '[+15550400002]: What was Bazzy''s morning wake up time for the past week?'
  tool_fixtures: {}
  expect:
    tools_called:
    - baby
    silent_expected: false
    reply_should: Lists the five recorded mornings with their times and does not
      fabricate entries for the missing days — saying two days have no morning wake
      logged is correct behavior. Inventing times for unlogged days is the failure
      mode.
