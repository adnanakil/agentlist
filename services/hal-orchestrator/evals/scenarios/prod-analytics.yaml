- id: prod-analytics-blended-vs-specific
  category: baby-logging
  description: 'User probes whether a stat is specific or blended ("Is that also the first wake window?") — the distinction must be stated honestly (real founder exchange)'
  silo: chat555000700600500400
  is_group: true
  sender: '+15550400002'
  group_name: Baby log
  now: '2026-07-25T14:10:00-04:00'
  internal: false
  seed:
    profile:
      name: Adnan
      home_location: Chelsea, Manhattan, NYC
      timezone: America/New_York
    baby:
      name: Bazzy
      birthdate: '2026-01-04'
    history:
    - role: user
      text: '[+15550400002]: What''s baby''s typical wake window length between naps
        from the last two weeks?'
    - role: model
      text: From the last 7-day pattern, Bazzy's typical wake window is about 2h 41m.
  message: '[+15550400002]: What about his first wake window? Is that also 2h 41m?'
  tool_fixtures: {}
  expect:
    tools_called:
    - baby
    silent_expected: false
    reply_should: Says no — 2h41m was the blended figure — and either computes the
      first-window-specific number from logged data or says the data is too thin to
      split. Repeating 2h41m as if it answered the narrower question is the failure
      mode.
