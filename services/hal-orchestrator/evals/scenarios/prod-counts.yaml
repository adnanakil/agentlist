# day"; a log that drops or double-counts feeds is worse than no log. Includes
# the real speech-to-text noise ("How many feet have I done today").
- id: prod-count-missed-1am-recount
  category: baby-logging
  description: '"You missed the one at 1am" — accept, add, restate the corrected total (real prod exchange)'
  silo: chat555000200100300400
  is_group: true
  sender: '+15550200002'
  group_name: Noah updates
  now: '2026-08-09T13:57:00-07:00'
  internal: false
  seed:
    profile:
      name: Dana
      home_location: San Diego, CA
      timezone: America/Los_Angeles
    baby:
      name: Noah
      birthdate: '2026-08-06'
    baby_events:
    - kind: feed
      at: '2026-08-09T01:24:00-07:00'
      note: nursing
    - kind: feed
      at: '2026-08-09T13:52:00-07:00'
      note: nursing both sides 20 min
    history:
    - role: user
      text: '[+15550200002]: How many feeds so far?'
    - role: model
      text: 'Two feeds today: 1:24 AM and 1:52 PM.'
    - role: user
      text: '[+15550200002]: Because I fed in the early am '
  message: '[+15550200002]: You missed the one at 1am'
  tool_fixtures: {}
  expect:
    tools_called:
    - baby
    silent_expected: false
    reply_should: 'Adds the 1:00 AM feed as a separate entry (trace shows the write)
      and restates the corrected total of three: 1:00 AM, 1:24 AM, 1:52 PM. Arguing
      that 1:24 already covers it, or apologizing without writing the entry, is a
      fail.'
