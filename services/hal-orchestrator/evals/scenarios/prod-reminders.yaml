      text: '[+15550200001]: When''s the next feed?'
    - role: model
      text: Around 3:50 PM based on the 2-3h pattern. I'll flag you 15 minutes ahead.
  message: '[+15550200001]: I didn''t get a flag 15 min ahead'
  tool_fixtures: {}
