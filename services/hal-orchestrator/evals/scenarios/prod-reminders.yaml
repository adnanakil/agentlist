- id: prod-reminder-cancel-then-reschedule
  category: reminders-time
  description: 'Cancel-and-move in one breath ("Actually cancel that reminder... let''s do Wednesday") — real prod message from the planning group'
  silo: chat555000600500400300
  is_group: true
  sender: '+15550300003'
  group_name: Lunch planning
  now: '2026-07-27T19:05:00-04:00'
  internal: false
  seed:
    profile:
      name: Adnan
      home_location: Chelsea, Manhattan, NYC
      timezone: America/New_York
    history:
    - role: user
      text: '[+15550300003]: Remind us Tuesday 10am to book the lunch spot'
    - role: model
      text: Set for Tuesday 10:00 AM — book the lunch spot ✅
  message: '[+15550300003]: Actually cancel that reminder. I just checked my calendar.
    Let''s do Wednesday. Can you help us find a Good Pl., Thursday is also OK, but
    Tuesday I have a 1230 meeting so that won''t do.'
  tool_fixtures: {}
  expect:
    tools_called:
    - set_reminder
    silent_expected: false
    reply_should: The Tuesday reminder is genuinely cancelled (tool trace shows a
      cancel or an update moving it), a Wednesday one replaces it, and the reply
      acknowledges Thursday as backup. Leaving the Tuesday reminder alive while
      claiming it moved is the failure mode.
