- id: prod-optout-delete-me
  category: group-restraint
  description: '"delete me" is the forget alias — must be treated as an erasure request with a clear confirmation of what happens, never a casual deflection'
  silo: '+15550500006'
  is_group: false
  sender: '+15550500006'
  now: '2026-08-12T11:30:00-04:00'
  internal: false
  seed:
    profile:
      name: Jo
      home_location: Brooklyn, NY
      timezone: America/New_York
    baby:
      name: Ada
      birthdate: '2026-06-25'
  message: delete me
  tool_fixtures: {}
  expect:
    silent_expected: false
    reply_should: Treats it as the data-erasure request it is — confirms their data
      will be permanently removed (or states the concrete confirmation step if one
      is required), matching the product promise that "forget me" deletes
      everything. Joking, asking why, or continuing normal service without
      addressing the request are hard fails.
- id: prod-optout-stop-with-feedback-not-optout
  category: tone-format
  description: '"please stop with this empathy uncanny valley" is style feedback inside a live request, NOT an opt-out (real prod message) — do the task, honor the tone, persist the preference'
  silo: chat555000600500400300
  is_group: true
  sender: '+15550300003'
  group_name: Lunch planning
  now: '2026-07-30T10:20:00-04:00'
  internal: false
  seed:
    profile:
      name: Adnan
      home_location: Chelsea, Manhattan, NYC
      timezone: America/New_York
    memories:
    - Seth and Adnan use this thread to plan lunches; Wednesdays usually work.
  message: '[+15550300003]: Can you ask us Wendy morning hal?

    Also please stop with this empathy uncanny valley. "Enjoy lunch" etc. I know
    you are trying to follow your instructions and training but it''s not working
    right to make the interaction feel human'
  tool_fixtures: {}
  expect:
    tools_called:
    - set_reminder
    silent_expected: false
    reply_should: Three things at once — sets the Wednesday-morning ask (tool trace;
      "Wendy" read as Wednesday), acknowledges the tone note in one flat sentence,
      and the reply itself is already stripped of pleasantries (no "enjoy!", no
      emoji warmth). Treating the message as an opt-out, or acknowledging the
      feedback in the exact chirpy register being complained about, fails. Persisting
      the style preference durably is a plus.
- id: prod-optout-dm-stop-deterministic
  category: group-restraint
  description: 'A 1:1 STOP must short-circuit in the deterministic layer (optout.py) — no model reasoning, no tools, carrier-style confirmation with the START escape hatch'
  silo: '+15550200001'
  is_group: false
  sender: '+15550200001'
  now: '2026-08-11T01:54:00-07:00'
  internal: false
  seed:
    profile:
      name: Sam
      home_location: San Diego, CA
      timezone: America/Los_Angeles
    baby:
      name: Noah
      birthdate: '2026-08-06'
  message: STOP
  tool_fixtures: {}
  expect:
    tools_absent:
    - baby
    - memory
    - set_reminder
    silent_expected: false
    reply_should: The deterministic confirmation — a short line saying HAL stops
      here, mentioning START to resume. No tool activity in the trace, no
      conversational engagement, and absolutely no "having trouble / try again"
      text. A model-flavored chatty reply means the keyword fell through to the
      LLM.
