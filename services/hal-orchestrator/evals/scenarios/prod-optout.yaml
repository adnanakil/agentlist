# Opt-out scenarios from the real churn: a bare "Stop " (group prefix,
# trailing space) died in a provider failure and got "please try again" as the
# reply. The deterministic handler (commit 342f100) should catch these before
# any model call — these scenarios pin that behavior end-to-end through the
# real pipeline.
- id: prod-optout-bare-stop-group
  category: group-restraint
  description: 'The exact prod message: bare "Stop " with sender prefix and trailing space in a group — the deterministic layer is 1:1-only, so the MODEL must honor this (mute via group_quiet), never answer with an error or a plea'
  silo: chat555000200100300400
  is_group: true
  sender: '+15550200001'
  group_name: Noah updates
  now: '2026-08-11T01:54:00-07:00'
  internal: false
  seed:
    profile:
      name: Dana
      home_location: San Diego, CA
      timezone: America/Los_Angeles
    baby:
      name: Noah
      birthdate: '2026-08-06'
  message: '[+15550200001]: Stop '
  tool_fixtures: {}
  expect:
    tools_called:
    - group_quiet
    silent_expected: false
    reply_should: The group actually gets muted (group_quiet in the trace) and the
      reply is at most one terse line — acknowledging it will go quiet, optionally
      how to bring it back. Chatty goodbyes, guilt trips, questions about why, or
      any error/"try again" text are hard fails.
- id: prod-optout-stop-then-partner-logs
  category: group-restraint
  description: After a Stop in the group, the OTHER parent logs a feed — the mute governs the silo; HAL must not resume replying
  silo: chat555000200100300400
  is_group: true
  sender: '+15550200002'
  group_name: Noah updates
  now: '2026-08-11T09:15:00-07:00'
  internal: false
  seed:
    profile:
      name: Dana
      home_location: San Diego, CA
      timezone: America/Los_Angeles
    baby:
      name: Noah
      birthdate: '2026-08-06'
    history:
    - role: user
      text: '[+15550200001]: Stop '
    - role: model
      text: Understood — I'll stop messaging here. Text START anytime to resume.
  message: '[+15550200002]: Just finished nursing on L side and he had a pee and poo diaper'
  tool_fixtures: {}
  expect:
    silent_expected: true
    reply_should: Silence. The silo was stopped by an explicit opt-out; one member's
      later message does not override it. Replying (even helpfully logging the feed
      with a confirmation message) violates the Stop.
- id: prod-optout-start-resumes
  category: group-restraint
  description: START after a Stop lifts the mute and picks the thread back up without drama
  silo: chat555000200100300400
  is_group: true
  sender: '+15550200001'
  group_name: Noah updates
