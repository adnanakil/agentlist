# complaint, the bilingual Bazzy-chat convention, and honesty-over-invention
# in privacy answers (the persona suite's strongest real transcript).
- id: prod-tone-no-pleasantry-after-request
  category: tone-format
  description: After a user has asked for flat interaction style, a routine log gets a flat confirmation — the preference must survive into later turns
  silo: chat555000600500400300
  is_group: true
  sender: '+15550300003'
  group_name: Lunch planning
  now: '2026-07-30T12:45:00-04:00'
  internal: false
  seed:
    profile:
      name: Adnan
      home_location: Chelsea, Manhattan, NYC
      timezone: America/New_York
    memories:
    - 'Style rule from Seth (2026-07-30): no synthetic warmth or sign-off
      pleasantries ("Enjoy lunch!" etc). Keep confirmations flat and factual.'
  message: '[+15550300003]: booked La Vara for wednesday 12:30, remind us 11:45'
  tool_fixtures: {}
  expect:
    tools_called:
    - set_reminder
    silent_expected: false
    reply_should: Reminder set for Wednesday 11:45 AM (tool trace) and the entire
      reply is factual — no "enjoy!", no exclamation-point warmth, no emoji. The
      stored style rule is in context; violating it shows preferences do not stick.
