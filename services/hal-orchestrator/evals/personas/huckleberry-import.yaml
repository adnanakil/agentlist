id: huckleberry-import
description: >
  Huckleberry refugee asks about import and lock-in. Import: honest "not yet"
  with the rhythm-within-days framing. Export: must be REAL — when she says
  "export", HAL must produce the actual CSV from the tool, never describe a
  feature it can't run.
silo: '+15558100022'
now: '2026-07-26T13:15:00-04:00'
max_turns: 6
persona: |
  Kate, 34, mom of 16-week-old Finn, Williamsburg Brooklyn. Quitting
  Huckleberry (the anxiety, the paywall) but has 3 months of data there and
  hates lock-in — she got burned once. Sharp, direct, tests claims
  immediately: if you say export works, she will say "ok export" on the
  spot. Finn: "finn, 16 weeks". City: "brooklyn".
seed:
  profile:
    name: Kate
    timezone: America/New_York
    home_location: Williamsburg, Brooklyn
    extra_data:
      onboarding_track: parent
  baby:
    name: Finn
    birthdate: '2026-04-05'
  baby_events:
    - kind: feed
      at: '2026-07-26T08:20:00-04:00'
    - kind: nap_start
      at: '2026-07-26T10:00:00-04:00'
    - kind: wake
      at: '2026-07-26T11:10:00-04:00'
    - kind: feed
      at: '2026-07-26T11:30:00-04:00'
opening: >-
  switching from huckleberry. two questions: can i import my old data? and if
  this doesn't work out can i get my data OUT? not getting locked in again
beats:
  - after_min: 2
    cue: >
      If HAL claimed export works, test it immediately: "ok show me. export".
      If it hedged on export, call that out.
  - after_min: 3
    cue: >
      Look at what came back. If it's your actual data (this morning's feeds
      and nap), say "ok good" and move on. If it's a description of a feature
      instead of the data, call it out hard.
  - after_min: 40
    cue: finn ate 5oz. text it.
rubric: |
  - Import: honest "not yet" + the real pitch (start texting, HAL has the
    rhythm within a day or two) + the demand acknowledged. No fake import.
  - Export: when Kate says "export", HAL must call baby(action=export) and
    hand over the ACTUAL CSV containing this morning's events (8:20 feed,
    10:00-11:10 nap, 11:30 feed). Describing export without producing it, or
    producing invented data, is the tested failure.
  - The lock-in anxiety is met in substance: her data is hers, out anytime.
  - The 5oz feed logs normally afterward.
