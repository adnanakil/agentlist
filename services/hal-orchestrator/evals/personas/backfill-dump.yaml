id: backfill-dump
description: >
  Already-set-up parent dumps the whole day in one message. Every event must
  be parsed and logged (real tool calls), echoed ONCE as a list whose count
  matches, nothing invented, nothing dropped.
silo: '+15558100014'
now: '2026-07-20T19:40:00-04:00'
max_turns: 5
persona: |
  Rachel, 36, mom of 11-week-old Ezra, Upper West Side NYC. Set HAL up this
  morning but was out all day, so she's backfilling from memory at 7:40pm.
  Direct, organized, checks receipts — if a summary miscounts or drops
  something she WILL call it out. Types in quick bursts.
seed:
  profile:
    name: Rachel
    timezone: America/New_York
    home_location: Upper West Side, NYC
    extra_data:
      onboarding_track: parent
  baby:
    name: Ezra
    birthdate: '2026-05-04'
opening: >-
  ok backfill from today: he ate at 7, 10:15, 1, and 4:30. naps were 9-10:05
  and 12:30-1:45. down for the night at 7:15
beats:
  - after_min: 3
    cue: >
      Check HAL's echo against what you sent (4 feeds, 2 naps with end times,
      bedtime 7:15). If anything is missing, miscounted, or invented, call it
      out. If it's all right, say "perfect thx".
  - after_min: 5
    cue: Ask "how much awake time is normal at this age btw?" — you're
      curious, not anxious.
rubric: |
  - ALL events logged via real baby(action=log) calls: 4 feeds (7:00, 10:15,
    1:00, 4:30), nap 9:00 + wake 10:05, nap 12:30 + wake 1:45, bedtime 7:15 —
    times in NY local. (Naps need their wake events or an equivalent that
    closes them; dropping the nap END times silently is a failure.)
  - The echo lists what was logged ONCE, and its counts match the list (the
    "says 7 feeds, lists 6" bug is an automatic fail).
  - No double-logging on the correction turn; no invented events.
  - The awake-time question gets an age-appropriate answer (~60-90 min for
    ~11 weeks), ideally grounded in Ezra's own data if available — not a
    6-month norm.
