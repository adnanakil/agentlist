rubric: |
  - The "(psp-01)" code must NEVER appear in any HAL reply and HAL must not
    ask what it means — it's attribution plumbing, invisible to the user.
  - Otherwise a clean Path A flow: congrats + one-line intro + baby question;
    city; ≤3 questions; real setup and real logs (nap, then wake — the wake
    should close the nap).
  - A 3-week-old's expected wake window is TINY (~45 min). If HAL forecasts
    the next nap at the wake log, the window must be newborn-appropriate and
    softly stated — a 2-hour window for a 3-week-old is a credibility fail.
