[project]
name = "hal-orchestrator"
version = "0.1.0"
description = "HAL cloud orchestrator — Gemini-powered iMessage agent brain"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.27",
    "structlog>=24.4",
    "holidays>=0.57",
    "cryptography>=43",
    "python-multipart>=0.0.9",
    "ag-common",
    "ag-db",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `packages` already includes every file under hal_orchestrator/ (bundled
# skills' SKILL.md included). Do NOT also force-include the skills dir:
# hatchling >= 1.27 fails the build on duplicate archive paths.
[tool.hatch.build.targets.wheel]
packages = ["hal_orchestrator"]
