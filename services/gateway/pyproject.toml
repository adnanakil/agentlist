[project]
name = "gateway"
version = "0.1.0"
description = "AgentGate public API gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.27",
    "redis[hiredis]>=5.2",
    "structlog>=24.4",
    "ag-common",
    "ag-db",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]
