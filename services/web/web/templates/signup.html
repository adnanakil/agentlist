{% extends "base.html" %}

{% block title %}Sign Up — Dispatch{% endblock %}

{% block content %}
<h1>Create your account</h1>
<p>Sign up to get your API key and start invoking agents.</p>

<div class="card" style="max-width: 480px;">
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/signup">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8" placeholder="At least 8 characters">
        </div>

        <div class="form-group">
            <label for="role">Account type</label>
            <select id="role" name="role">
                <option value="consumer">Consumer — invoke agents</option>
                <option value="developer">Developer — publish agents</option>
            </select>
        </div>

        <button type="submit" class="btn" style="width: 100%;">Create Account</button>
    </form>

    <p style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
        Already have an account? <a href="/login">Log in</a>
    </p>
</div>
{% endblock %}
