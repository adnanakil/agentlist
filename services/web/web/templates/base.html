<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AgentGate{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --bg-secondary: #fafafa;
            --surface: #ffffff;
            --border: #e5e5e5;
            --border-hover: #cfcfcf;
            --text: #0a0a0a;
            --text-secondary: #6b6b6b;
            --text-tertiary: #a3a3a3;
            --accent: #0a0a0a;
            --accent-hover: #262626;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-size: 15px;
            line-height: 1.6;
        }

        a { color: var(--text); text-decoration: none; }
        a:hover { color: var(--text-secondary); }

        nav {
            padding: 0.85rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        nav .logo {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.04em;
        }

        nav .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            font-weight: 500;
            font-size: 0.875rem;
        }

        nav .nav-links a {
            color: var(--text-secondary);
            transition: color 0.15s;
        }

        nav .nav-links a:hover { color: var(--text); }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            flex: 1;
            width: 100%;
        }

        .container.wide { max-width: 980px; }

        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            color: var(--text);
            letter-spacing: -0.04em;
            line-height: 1.15;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text);
            letter-spacing: -0.02em;
        }

        h3 { font-weight: 600; color: var(--text); }

        p {
            line-height: 1.65;
            margin-bottom: 0.75rem;
            color: var(--text-secondary);
            font-size: 0.938rem;
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 0.6rem 1.4rem;
            background: var(--accent);
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background 0.15s;
        }

        .btn:hover {
            background: var(--accent-hover);
            color: #ffffff;
            text-decoration: none;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-outline:hover {
            background: var(--bg-secondary);
            border-color: var(--border-hover);
            color: var(--text);
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.75rem;
            margin-bottom: 1rem;
            transition: border-color 0.15s;
        }

        .card:hover { border-color: var(--border-hover); }

        .form-group { margin-bottom: 1.25rem; }
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            color: var(--text);
            font-size: 0.875rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.65rem 0.9rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.9rem;
            transition: border-color 0.15s;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--text);
        }

        .form-group input::placeholder, .form-group textarea::placeholder {
            color: var(--text-tertiary);
        }

        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.25rem;
            font-size: 0.875rem;
        }

        .success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #16a34a;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.25rem;
            font-size: 0.875rem;
        }

        .api-key-display {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.85rem 1rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.85rem;
            word-break: break-all;
            position: relative;
            color: var(--text);
        }

        .snippet-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.65;
            max-height: 400px;
            overflow-y: auto;
            position: relative;
            color: var(--text-secondary);
        }

        .copy-btn {
            position: absolute;
            top: 0.6rem;
            right: 0.6rem;
            padding: 0.3rem 0.65rem;
            font-size: 0.75rem;
            font-weight: 600;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .copy-btn:hover { border-color: var(--border-hover); color: var(--text); }

        .stat { display: inline-block; margin-right: 2rem; margin-bottom: 0.75rem; }
        .stat-value {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.04em;
        }
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        footer {
            border-top: 1px solid var(--border);
            padding: 1.75rem 2rem;
            text-align: center;
            color: var(--text-tertiary);
            font-size: 0.8rem;
        }

        ::selection { background: rgba(10, 10, 10, 0.08); }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo" style="text-decoration: none;">AgentGate</a>
        <div class="nav-links">
            {% block nav_links %}
            <a href="/signup">Sign Up</a>
            <a href="/login">Log In</a>
            {% endblock %}
        </div>
    </nav>

    <div class="container {% block container_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </div>

    <footer>AgentGate</footer>

    {% block scripts %}{% endblock %}
</body>
</html>
