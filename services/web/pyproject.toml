[project]
name = "web"
version = "0.1.0"
description = "AgentGate web signup and dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "cryptography>=43.0",
    "structlog>=24.4",
    "ag-common",
    "ag-db",
    "twilio>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web"]
