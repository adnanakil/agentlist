[project]
name = "billing"
version = "0.1.0"
description = "AgentGate billing service — ledger, holds, Stripe"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "stripe>=11.0",
    "structlog>=24.4",
    "ag-common",
    "ag-db",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["billing"]
