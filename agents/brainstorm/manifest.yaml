name: brainstorm
version: "0.1.0"
description: "Creative brainstorming partner powered by AI. Generate ideas, explore concepts, reframe problems, and think through challenges from multiple angles. Uses high-temperature generation for more creative and diverse outputs."
runtime: python
entrypoint: agent.py
category: research
tags: [brainstorm, ideas, creative, thinking, strategy]
price_per_call_cents: 5
input_schema:
  type: object
  properties:
    topic:
      type: string
      description: "The topic, problem, or question to brainstorm about"
    style:
      type: string
      description: "Brainstorming style: 'divergent' (many ideas), 'convergent' (refine/evaluate), 'reframe' (new perspectives), or 'freeform' (default)"
    num_ideas:
      type: integer
      description: "Number of ideas to generate (default: 5)"
  required: [topic]
