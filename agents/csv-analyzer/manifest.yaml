name: csv-analyzer
version: "0.1.0"
description: "Analyzes CSV data providing row counts, column names, and basic statistics (min, max, mean) for numeric columns."
runtime: python
entrypoint: agent.py
category: data
tags: [csv, data, analysis, statistics]
price_per_call_cents: 3
input_schema:
  type: object
  properties:
    csv_data:
      type: string
      description: "The CSV data as a string"
    delimiter:
      type: string
      description: "The delimiter character (default: comma)"
  required: [csv_data]
