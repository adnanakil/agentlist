[project]
name = "agentgate-sdk"
version = "0.1.0"
description = "SDK for building AgentGate agents"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentgate_sdk"]
