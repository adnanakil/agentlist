[project]
name = "agentgate"
version = "0.1.0"
description = "Hosted agent marketplace — one URL, one API key, any agent"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "pyyaml>=6.0.3",
]

[tool.uv.workspace]
members = [
    "packages/ag-common",
    "packages/ag-db",
    "services/gateway",
    "services/registry",
    "services/orchestrator",
    "services/billing",
    "services/web",
    "services/hal-orchestrator",
    "agent-sdk/python",
]

[tool.uv.sources]
ag-common = { workspace = true }
ag-db = { workspace = true }
agentgate-sdk = { workspace = true }
hal-orchestrator = { workspace = true }

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "agentgate-sdk",
    "hal-orchestrator",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["ag_common", "ag_db", "gateway", "registry", "orchestrator", "billing", "web", "hal_orchestrator", "agentgate_sdk"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "docker.*", "stripe.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
